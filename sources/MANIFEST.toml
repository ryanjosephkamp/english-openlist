[[source]]
id               = "google_books_1gram_eng_2020"
group            = "corpus"
url              = "http://storage.googleapis.com/books/ngrams/books/20200217/eng/1-NNNNN-of-00024.gz"
sha256           = ""                  # per-shard — see [[source.shard]] rows
retrieved        = 2026-08-17
licence          = "CC-BY-3.0"
redistributable  = true                # aggregates only; raw shards deleted
normalization    = "inherit (casefold-and-sum — D-031; volume overcount documented)"
expansion        = "none"
record_count     = 14808627
derives_from     = []
frame_dependency = true                # detector shares an error mode with the
                                       # frame-generation process; S5 models it
binary           = false               # NEVER binarised on raw frequency (§2.4)
frame_contributor = false              # D-030
shard_count      = 24
aggregate        = "derived/google_books_1grams.parquet"
columns          = ["total_match", "total_volume", "first_year", "last_year", "year_count"]
notes = """
Streamed one shard at a time — download, aggregate, delete — peak disk one
shard (~265 MB). The raw shards carry volume_count, which the Ngram Viewer API
does not expose, and volume-level dispersion is the only remaining separator
of OCR noise from rare real words. total_volume overcounts words with common
capitalised forms (case variants share volumes within a year); documented bias
on a feature, acceptable where it would not be on a count.
"""

