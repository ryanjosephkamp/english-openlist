# sources/MANIFEST.toml
#
# The evidence matrix reproduces byte-for-byte from this file alone, on a clean
# machine, by anyone. Every source is pinned to a checksummed artifact; every
# derived key set carries its own hash in .cache/sources/derived/<id>.meta.json;
# and `python -m research.ingest.verify_manifest` fails the build when manifest,
# meta and disk disagree — count-level or byte-level.
#
# HARD RULE: a source whose ingest does not reproduce its declared record_count
# is a failure that stops the build. It is never downgraded to a warning.
#
# See PROTOCOL.md §2 for the source design, D-025 for the form rule, D-026/D-030
# for what contributes to the frame, and D-031 for the case conventions.

[manifest]
version          = 2
protocol         = "PROTOCOL.md"
created          = 2026-08-16
updated          = 2026-08-17
normalization    = "NFC; casefold; accept iff ^[a-z]+$"

# NOT a form rule — an ingest integrity check against concatenation bugs.
# No source tripped it in Phase 1; the longest key anywhere is 63 characters.
length_flag_over = 100

[candidate_universe]
# Frozen at a pinned Hugging Face revision — the nightly moves labels daily,
# and Phase 1 reads the string set at this revision and nothing newer. This is
# the revision that published the D-025 form-rule correction, so every string
# in it satisfies ^[a-z]+$ with zero exceptions.
repo             = "ryanjosephkamp/english-openlist"
repo_type        = "dataset"
revision         = "c113969807f3045f5ddd8cc919d0189d54ba368b"  # 2026-08-17T04:28:43Z
files            = ["data/merged_valid_words.txt", "data/merged_invalid_words.txt"]
pinned_total     = 9653999
sha256_valid     = "aa8df4c5d4358b67119462a27accf29c919309814d8b33377b03c4bf0244f6e0"
sha256_invalid   = "23701bd85e9be2aad94c10628cb257cb08d1db9494b01b8672e46270a6cd5672"

# The frame is source-augmented (D-026), by the BINARY detector sources only
# (D-030): corpus sources contribute features, never members. Per-source add
# counts live in research/data/frame_contributions.json.
frame_is_source_augmented = true


